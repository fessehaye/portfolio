# Media configuration: where your images live
media:
  input: src/img
  output: /img
components:
  project:
    label: Project
    type: object
    fields:
      - name: title
        label: Project Title
        type: string
      - name: repo
        label: GitHub Repository URL
        type: string
      - name: demo
        label: Live Demo URL
        type: string
      - name: preview
        label: Preview Image
        type: image
        options:
          path: src/img/projects/
      - name: description
        label: Description
        type: text
      - name: keywords
        label: Technologies / Tags
        type: string
        list: true
content:
  - name: site
    label: Site Info
    path: src/_data/site.json
    type: file
    fields:
      - name: author
        label: author
        type: string
      - name: github
        label: github
        type: string
        pattern: ^(https?:\/\/)?(www\.)?[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/[^\s]*)?$
      - name: mail
        label: mail
        type: string
      - name: twitter
        label: twitter
        type: string
        pattern: ^(https?:\/\/)?(www\.)?[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/[^\s]*)?$
      - name: instagram
        label: instagram
        type: string
        pattern: ^(https?:\/\/)?(www\.)?[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/[^\s]*)?$
  - name: home
    label: Home Page Info
    path: src/_data/home.json
    type: file
    fields:
      - name: title
        label: title
        type: string
      - name: location
        label: location
        type: string
      - name: jobRole
        label: Job Role
        type: string
      - name: job
        label: Job
        type: string
      - name: currentRole
        label: Current Role
        type: boolean
  - name: projects
    label: Projects
    type: file
    path: src/_data/projects.json
    list: true
    fields:
      - name: projectlist
        label: Projects
        component: project
